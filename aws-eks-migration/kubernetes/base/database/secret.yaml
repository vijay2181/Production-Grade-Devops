# ── IMPORTANT ────────────────────────────────────────────────────
# Do NOT commit real secrets. Use one of:
#   1. AWS Secrets Manager + External Secrets Operator (recommended)
#   2. Sealed Secrets (kubeseal)
#   3. kubectl create secret (CI/CD injects at deploy time)
#
# This file shows the structure only — values are base64 placeholders.
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: myapp
type: Opaque
# These are base64-encoded. Generate with:
#   echo -n 'myuser'         | base64
#   echo -n 'mysecretpassword' | base64
data:
  DB_USER:     bXl1c2Vy                  # myuser
  DB_PASSWORD: bXlzZWNyZXRwYXNzd29yZA== # mysecretpassword
