apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-monitor
  namespace: myapp
  labels:
    release: kube-prometheus-stack   # must match Prometheus operator selector
spec:
  selector:
    matchLabels:
      app: api
  namespaceSelector:
    matchNames:
      - myapp
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
