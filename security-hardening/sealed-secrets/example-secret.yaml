# ── SealedSecret example: db-credentials ─────────────────────────
# Generated by: ./seal.sh myapp db-credentials DB_USER=myuser DB_PASSWORD=s3cr3t
#
# This is what gets committed to Git instead of a plain Secret.
# The encrypted values can ONLY be decrypted by the cluster controller.
# Anyone who reads this file gets encrypted gibberish — not the actual secrets.
#
# To regenerate:
#   kubectl create secret generic db-credentials \
#     --from-literal=DB_USER=myuser \
#     --from-literal=DB_PASSWORD=mysecretpassword \
#     --dry-run=client -o yaml | \
#   kubeseal --format=yaml > sealed-secrets/myapp-db-credentials.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: db-credentials
  namespace: myapp
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # These values are encrypted — safe to commit
    # The actual values are: DB_USER=myuser, DB_PASSWORD=mysecretpassword
    DB_USER: AgBkX9...  # replace with real kubeseal output
    DB_PASSWORD: AgCmY...  # replace with real kubeseal output
  template:
    metadata:
      name: db-credentials
      namespace: myapp
    type: Opaque
