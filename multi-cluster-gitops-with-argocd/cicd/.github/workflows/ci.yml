# ============================================================
# CI/CD Pipeline — GitOps version
#
# KEY DIFFERENCE from Project 1:
#   Project 1: GitHub Actions ran `helm upgrade` directly
#   This project: GitHub Actions ONLY builds + pushes to ECR
#                 ArgoCD Image Updater detects the new tag
#                 and updates Git + triggers deploy automatically
#
# This means:
#   - CI has NO cluster access (more secure)
#   - ArgoCD is the only thing that touches the cluster
#   - Full GitOps: every deploy is traceable to a Git commit
# ============================================================
name: CI — Build and Push

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main]

env:
  AWS_REGION:   ${{ secrets.AWS_REGION || 'us-east-1' }}
  IMAGE_NAME:   myapp/api

jobs:
  # ─── 1. Test ──────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "../../aws-eks-migration/app/package-lock.json"

      - name: Install + test
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
        working-directory: "../../aws-eks-migration/app"

  # ─── 2. Build + Push to ECR ───────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute semantic image tag
        id: tag
        run: |
          # On main: semver tag from git tag (e.g. v1.2.3)
          # On develop: dev-<sha>
          # On staging: staging-<sha>
          BRANCH="${{ github.ref_name }}"
          SHA=$(echo "${{ github.sha }}" | cut -c1-8)

          if [[ "$BRANCH" == "main" ]]; then
            # Use git tag if present, else semver-ish
            TAG=$(git describe --tags --exact-match 2>/dev/null || echo "v0.0.0-${SHA}")
          elif [[ "$BRANCH" == "staging" ]]; then
            TAG="staging-${SHA}"
          else
            TAG="dev-${SHA}"
          fi

          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Tag: ${TAG}"

      - name: Build + push
        env:
          REGISTRY:  ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build \
            --file ../../aws-eks-migration/app/Dockerfile \
            --tag $REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
            --tag $REGISTRY/$IMAGE_NAME:latest \
            --cache-from $REGISTRY/$IMAGE_NAME:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            ../../aws-eks-migration/app/

          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # ── NOTE: No kubectl / helm here ──────────────────────────
      # ArgoCD Image Updater polls ECR every 2 min.
      # When it detects the new tag, it:
      #   1. Updates apps/myapp/overlays/<env>/kustomization.yaml
      #   2. Commits back to Git
      #   3. ArgoCD detects the commit → syncs cluster
      # Full GitOps loop — CI never touches the cluster.
