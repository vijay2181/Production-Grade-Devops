# =============================================================
# karpenter/nodepools/04-nodepool-ci-ephemeral.yaml
# Tier 3: High-Burst Ephemeral CI/CD Workloads
# Targeted by: Project 5 Jenkins Kaniko build agents, Trivy scanners
# High compute capacity, 100% Spot, aggressive instantaneous consolidation
# =============================================================

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ci-ephemeral
  labels:
    managed-by: karpenter
spec:
  template:
    metadata:
      labels:
        nodepool: ci-ephemeral
        tier: build-batch
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Dedicated taint so regular production microservices never land here
      taints:
        - key: dedicated
          value: ci-builds
          effect: NoSchedule

      requirements:
        # STRICT 100% Spot (CI jobs can be restarted if interrupted)
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]

        # Dual architecture
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]

        # High-CPU Compute Optimized instances for fast container compiles
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["2xlarge", "4xlarge", "8xlarge"]

  disruption:
    # Kill node the exact moment builds finish (zero idle cost)
    consolidationPolicy: WhenEmpty
    consolidateAfter: 0s

    # Hard timeout: if a build gets stuck, terminate node after 30 minutes
    expireAfter: 30m

    budgets:
      - nodes: "100%"   # Allow tearing down all empty CI nodes at once

  limits:
    cpu: "300"
    memory: 600Gi
