apiVersion: v1
kind: Service
metadata:
  name: jenkins-ha
  namespace: jenkins-ha
  labels:
    app.kubernetes.io/name: jenkins-ha
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: jenkins-ha
    app.kubernetes.io/component: controller
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-ha-jnlp
  namespace: jenkins-ha
  labels:
    app.kubernetes.io/name: jenkins-ha
spec:
  type: ClusterIP
  ports:
    - port: 50000
      targetPort: 50000
      name: jnlp
  selector:
    app.kubernetes.io/name: jenkins-ha
    app.kubernetes.io/component: controller
