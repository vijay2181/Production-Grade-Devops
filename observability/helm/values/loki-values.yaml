# ── Loki Helm values — production FIXED ──────────────────────────
# Fix 1: schema v12 → v13 (required for structured_metadata + traceId correlation)
# Fix 2: auth_enabled structure corrected
# Fix 3: retention configured via compactor not limits_config

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: s3
    s3:
      region: us-east-1
      bucketnames: myapp-loki-logs
      # Uses IRSA — no static credentials

  # Fix: schema v13 required for structured_metadata feature
  # structured_metadata is what allows traceId → Tempo link
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13            # ← was v12, must be v13 for structured_metadata
        index:
          prefix: index_
          period: 24h

  # Retention via compactor (correct way in Loki 3.x)
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    delete_request_store: s3

  limits_config:
    retention_period: 720h       # 30 days
    ingestion_rate_mb: 32
    ingestion_burst_size_mb: 64
    max_query_length: 721h
    max_streams_per_user: 10000
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB
    # Allow structured metadata (needed for traceId correlation)
    allow_structured_metadata: true   # ← required for v13

  query_range:
    align_queries_with_step: true
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 100

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/myapp-loki-s3-role"

# Promtail DaemonSet — ships pod logs to Loki
promtail:
  enabled: true
  config:
    clients:
      - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
    snippets:
      pipelineStages:
        - docker: {}
        # Parse JSON logs from our Node.js app
        - match:
            selector: '{app="api"}'
            stages:
              - json:
                  expressions:
                    level:    level
                    message:  message
                    traceId:  traceId
                    spanId:   spanId
                    route:    route
                    status:   status
              - labels:
                  level:
              # Fix: structured_metadata (v13) stores traceId outside labels
              # This is what enables the Loki → Tempo derived field link
              - structured_metadata:
                  traceID: traceId
                  spanID:  spanId
