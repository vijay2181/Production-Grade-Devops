# =============================================================
# jcasc/credentials.yaml — Jenkins Credentials as Code
#
# IMPORTANT: This file does NOT contain actual secrets.
# It defines credential configurations that pull from:
#   - AWS Secrets Manager (via jenkins-aws-secrets-manager plugin)
#   - Kubernetes Secrets (mounted as env vars)
#
# Real values live in AWS Secrets Manager under: jenkins/*
# =============================================================

credentials:
  system:
    domainCredentials:
      - credentials:

          # ── GitHub App credentials (for SCM + webhooks) ──────────
          # GitHub App is preferred over personal tokens:
          #   - Higher rate limits (5000/hr per installation vs 60/hr)
          #   - Short-lived tokens (auto-rotated every 1 hour)
          #   - Scoped to repositories (not a user's full account)
          - gitHubApp:
              id: "github-app-credentials"
              description: "GitHub App for Jenkins (auto-rotated)"
              appID: "${GITHUB_APP_ID}"
              privateKey: "${GITHUB_APP_PRIVATE_KEY}"
              # Owner: GitHub organisation name
              owner: "company"

          # ── Slack token (from Secrets Manager) ───────────────────
          - string:
              id: "slack-token"
              description: "Slack bot token for notifications"
              secret: "${SLACK_BOT_TOKEN}"

          # ── SonarQube token ───────────────────────────────────────
          - string:
              id: "sonarqube-token"
              description: "SonarQube authentication token"
              secret: "${SONARQUBE_TOKEN}"

          # ── ArgoCD API token ──────────────────────────────────────
          # Used by pipelines to trigger ArgoCD sync via API
          # Role: app-sync (can sync applications, cannot delete)
          - string:
              id: "argocd-token"
              description: "ArgoCD API token for pipeline sync trigger"
              secret: "${ARGOCD_AUTH_TOKEN}"

          # ── Cosign key (image signing) ────────────────────────────
          # Private key for signing container images
          # Public key stored in Kyverno policy (Project 4)
          - string:
              id: "cosign-private-key"
              description: "Cosign private key for image signing"
              secret: "${COSIGN_PRIVATE_KEY}"

          - string:
              id: "cosign-password"
              description: "Cosign private key password"
              secret: "${COSIGN_PASSWORD}"

          # ── NPM token (private packages) ──────────────────────────
          - string:
              id: "npm-token"
              description: "NPM token for private packages"
              secret: "${NPM_TOKEN}"

          # NOTE: AWS credentials are NOT defined here.
          # Agents use IRSA (IAM Roles for Service Accounts).
          # The agent pod gets a short-lived AWS token from STS automatically.
          # No AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY in Jenkins.
