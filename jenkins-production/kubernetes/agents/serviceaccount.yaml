---
# kubernetes/agents/serviceaccount.yaml
# IRSA ServiceAccount for Jenkins build agents
# Agents get: ECR push/pull, S3 artifacts, Secrets Manager read
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: jenkins
  annotations:
    # Populated from Terraform output: jenkins_agent_role_arn
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/jenkins-agent-irsa"
  labels:
    app: jenkins
    component: agent

---
# ClusterRole for agents — they need to apply manifests in some pipelines
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-agent
  labels:
    app: jenkins
    component: agent
rules:
  # Agents apply kustomize/kubectl during integration test stage
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  # ArgoCD application sync trigger
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch"]
  # Read rollout status (from Project 2)
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-agent
  labels:
    app: jenkins
    component: agent
subjects:
  - kind: ServiceAccount
    name: jenkins-agent
    namespace: jenkins
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: jenkins-agent
